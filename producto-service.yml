spring:
  application:
    name: producto-service
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
mensaje:
  texto: Configuración obtenida desde Config Server para Producto Service
lab14:
  config-origin: github-config-repo

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 2
    instances:
      categoriaService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        recordExceptions:
          - com.tecsup.services.FalloTemporal
        ignoreExceptions:
          - feign.FeignException
          - io.github.resilience4j.bulkhead.BulkheadFullException
        eventConsumerBufferSize: 100
  retry:
    instances:
      categoriaRetry:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - com.tecsup.services.FalloTemporal
        eventConsumerBufferSize: 100
  bulkhead:
    bulkheadAspectOrder: 1
    instances:
      categoriaBulkhead:
        maxConcurrentCalls: 2
        maxWaitDuration: 1s
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads
